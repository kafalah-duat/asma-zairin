<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" href="logo.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0e2c50">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="الزائرين">
<title>أسماء الزائرين للمشاريع ١٤٤٨ هـ</title>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef4fb;--card:#fff;--ink:#14263d;--mut:#5f7189;--line:#d8e3f0;--g:#2f6fb3;--gd:#12365e;--acc:#3b9ac9;--hov:#e9f2fc;--th:#fff;--sh:0 1px 2px rgba(20,50,90,.06),0 8px 24px rgba(20,50,90,.08);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0d1722;--card:#13212f;--ink:#e6eef8;--mut:#93a6bb;--line:#223548;--g:#5aa2e0;--gd:#e6eef8;--acc:#6cc0e8;--hov:#192b3d;--th:#06121f;--sh:0 8px 24px rgba(0,0,0,.35)}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0d1722;--card:#13212f;--ink:#e6eef8;--mut:#93a6bb;--line:#223548;--g:#5aa2e0;--gd:#e6eef8;--acc:#6cc0e8;--hov:#192b3d;--th:#06121f;--sh:0 8px 24px rgba(0,0,0,.35)}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Cairo,"Segoe UI",Tahoma,sans-serif;font-size:15px}
#app{display:grid;grid-template-columns:300px 1fr;min-height:100vh}
aside{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding:28px 20px;color:#e8f1fb;
background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.04) 0 1px,transparent 1px 22px),repeating-linear-gradient(-45deg,rgba(255,255,255,.04) 0 1px,transparent 1px 22px),linear-gradient(160deg,#1f5a96,#0e2c50 70%)}
.logo{display:block;width:170px;height:auto;margin:0 auto 22px;filter:brightness(0) invert(1);opacity:.95}
.sep{border-bottom:1px solid rgba(160,205,240,.35);margin:0 4px 6px}
.lbl{font-size:12px;color:#a9c4df;margin:16px 6px 8px}
.nav{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;border:0;background:none;color:inherit;font:inherit;text-align:right;padding:11px 14px;border-radius:12px;cursor:pointer;transition:.15s}
.nav:hover{background:rgba(255,255,255,.09)}
.nav.on{background:#e6f1fc;color:#0e2c50;font-weight:700}
.nav small{font-size:12px;min-width:26px;text-align:center;padding:2px 8px;border-radius:99px;background:rgba(255,255,255,.16)}
.nav.on small{background:#0e2c50;color:#e6f1fc}
.st{font-size:12px;color:#a9c4df;padding:0 6px;display:flex;gap:8px;align-items:center}
.st i{width:8px;height:8px;border-radius:50%;background:#6fd3a0;display:inline-block}
.st.off i{background:#e9a05c}
main{padding:40px 48px 64px;max-width:1320px;width:100%}
.hero{margin-bottom:28px}
h1{font-family:Amiri,serif;font-size:44px;line-height:1.3;margin:0;color:var(--gd)}
.hero p{margin:6px 0 0;color:var(--acc);font-family:Amiri,serif;font-size:22px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:28px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px 20px;box-shadow:var(--sh);cursor:pointer;text-align:right;font:inherit;color:inherit;border-top:4px solid var(--c,var(--g));transition:.15s}
.stat:hover{transform:translateY(-2px)}
.stat b{display:block;font-family:Amiri,serif;font-size:42px;line-height:1.1;color:var(--c,var(--g))}
.stat span{font-size:13px;color:var(--mut);line-height:1.5;display:block;margin-top:4px}
.stat.tot{background:linear-gradient(150deg,#2f6fb3,#12365e);border-color:transparent;color:#eaf3fd}
.stat.tot b{color:#bfe3fa}.stat.tot span{color:#c6dbf0}
.bar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.pill{border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;padding:8px 16px;border-radius:99px;cursor:pointer;transition:.15s}
.pill:hover{background:var(--hov)}
.pill.on{background:var(--g);border-color:var(--g);color:var(--th);font-weight:600}
.search{margin-inline-start:auto;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;padding:8px 16px;border-radius:99px;width:240px}
.search:focus,.cell:focus{outline:2px solid var(--acc);outline-offset:0}
.tw{background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:var(--sh);overflow:auto}
table{width:100%;border-collapse:collapse}
th{background:var(--g);color:var(--th);font-family:Amiri,serif;font-size:20px;font-weight:700;padding:14px 16px;text-align:center;white-space:nowrap}
td{padding:12px 16px;border-top:1px solid var(--line);vertical-align:middle;line-height:1.7}
tbody tr:hover{background:var(--hov)}
td.n{text-align:center;color:var(--mut);width:56px;font-family:Amiri,serif;font-size:18px}
td.c{text-align:center}
.av{width:46px;height:46px;border-radius:50%;object-fit:cover;background:var(--hov);border:2px solid var(--line);display:inline-flex;align-items:center;justify-content:center;color:var(--g);font-weight:700;font-size:18px;padding:0;overflow:hidden;font-family:inherit;vertical-align:middle}
button.av{cursor:pointer;transition:.15s}button.av:hover{border-color:var(--acc)}
.av img{width:100%;height:100%;object-fit:cover;display:block}
.badge{display:inline-block;padding:3px 12px;border-radius:99px;font-size:12.5px;font-weight:600;color:var(--c);background:color-mix(in srgb,var(--c) 15%,transparent);white-space:nowrap}
.lnk{color:var(--g);font-weight:600;text-decoration:none;border-bottom:1px dashed currentColor}
.cell{width:100%;border:1px solid transparent;background:transparent;color:inherit;font:inherit;padding:8px 10px;border-radius:10px;resize:none;field-sizing:content;min-height:40px;line-height:1.7}
input[type=date].cell{direction:ltr;text-align:center;min-width:140px}
.cell:hover{border-color:var(--line);background:var(--bg)}
.cell:focus{background:var(--bg)}
.x{border:0;background:none;color:var(--mut);cursor:pointer;font:inherit;font-size:13px;padding:6px 10px;border-radius:8px}
.x:hover,.x.arm{background:#c4552e;color:#fff}
.act{position:sticky;left:0;background:var(--card);white-space:nowrap;text-align:center;box-shadow:6px 0 10px -8px rgba(20,50,90,.35);z-index:2}
th.act{background:var(--g);box-shadow:none;min-width:150px}
tbody tr:hover .act{background:var(--hov)}
.sv{border:1px solid var(--g);background:none;color:var(--g);font:inherit;font-size:13.5px;font-weight:700;padding:6px 16px;border-radius:10px;cursor:pointer;margin-inline-end:6px;transition:.15s}
.sv:hover{background:var(--g);color:var(--th)}
.sv.dirty{background:#e08a2e;border-color:#e08a2e;color:#fff}
.sv.ok{background:#2c8c6f;border-color:#2c8c6f;color:#fff}
.sv:disabled{opacity:.7;cursor:wait}
.add{margin-top:18px;border:2px dashed var(--g);background:none;color:var(--g);font:inherit;font-weight:700;padding:14px;border-radius:16px;width:100%;cursor:pointer;transition:.15s}
.add:hover{background:var(--g);color:var(--th)}
.empty{text-align:center;color:var(--mut);padding:56px 20px;font-family:Amiri,serif;font-size:22px}
.dh{display:flex;align-items:center;gap:16px;margin-bottom:22px}
.dn{font-family:Amiri,serif;font-size:36px;font-weight:700;padding:4px 12px;width:auto;min-width:260px;border-color:var(--line)}
.hint{color:var(--mut);font-size:13.5px;margin:0 0 22px}
.cur,.burger,.fsel{display:none}
@media (max-width:820px){
 #app{grid-template-columns:1fr}
 aside{position:sticky;top:0;z-index:30;height:auto;max-height:100vh;overflow-y:auto;flex-direction:row;flex-wrap:wrap;align-items:center;gap:10px;padding:10px 14px}
 .logo{width:46px;margin:0}
 .cur{display:block;flex:1;font-family:Amiri,serif;font-size:20px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
 .burger{display:block;border:1px solid rgba(255,255,255,.3);background:none;color:inherit;font:inherit;font-size:20px;width:42px;height:42px;border-radius:12px;cursor:pointer}
 .sep,.mn{display:none}
 aside.open .sep{display:block;width:100%}
 aside.open .mn{display:block;flex:none!important;width:100%;overflow:visible!important}
 main{padding:20px 14px 48px}
 h1{font-size:28px}.hero p{font-size:17px}
 .stats{grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:20px}
 .stat{padding:14px}.stat b{font-size:32px}
 .search{width:100%;margin:0;font-size:16px}
 .bar{gap:10px}
 .pill{display:none}
 .fsel{display:block;width:100%;font:inherit;font-size:16px;font-weight:600;padding:12px 16px;border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink)}
 .tw{overflow:visible;border-radius:16px}
 thead{display:none}
 table,tbody{display:block}
 tbody tr{display:block;position:relative;padding:14px 14px 10px;border-top:1px solid var(--line)}
 tbody tr:first-child{border-top:0}
 td{display:flex;gap:10px;align-items:flex-start;padding:4px 0;border:0}
 td[data-l]::before{content:attr(data-l);flex:0 0 78px;font-size:12.5px;color:var(--mut);padding-top:3px}
 td.n{position:absolute;top:12px;left:14px;width:auto;padding:0}
 td.c{justify-content:flex-start}
 td .cell{flex:1;min-width:0;font-size:16px}
 td.empty{display:block;padding:36px 10px}
 td.act{position:static;box-shadow:none;background:none;display:flex;gap:8px;justify-content:flex-start;padding-top:10px}
 td.act .sv{flex:1;padding:10px;font-size:15px;margin:0}
 td.act .x{padding:10px 18px}
 .dh{flex-wrap:wrap;gap:10px}
 .dn{min-width:0;flex:1;font-size:26px}
 .dh .x{margin-inline-start:0!important}
}
@media (min-width:821px){
 html,body{height:100%;overflow:hidden}
 #app{height:100vh;min-height:0}
 main{height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:auto;padding:40px 48px 32px}
 main>*{flex:none}
 main>.tw{flex:1 1 auto;min-height:260px;overflow:auto}
 .tw table{border-collapse:separate;border-spacing:0}
 thead th{position:sticky;top:0;z-index:3}
 th.act{z-index:4}
}
</style>
</head>
<body>
<div id="app"></div>
<script src="config.js"></script>
<script>
const ALL='all';
const DEF=[{id:'d1',name:'مؤسسة الرسالة للخدمات الإنسانية',c:'#2f6fb3'},{id:'d2',name:'جامعة السنة الإسلامية',c:'#1f9a9a'},{id:'d3',name:'معهد التبيان',c:'#6b6fd6'},{id:'d4',name:'الدور السالفية',c:'#3f8fd0'},{id:'d5',name:'الشبكة الإعلامية',c:'#4a7fa8'}];
const PAL=['#2f6fb3','#1f9a9a','#6b6fd6','#3f8fd0','#4a7fa8','#2c8c6f','#7a6fc0','#5aa0b8'];
let menuOpen=false,depts=DEF.map(x=>({...x})),rows=[],view=ALL,flt=ALL,q='',status='جارٍ الاتصال…',off=false;
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const dn=id=>(depts.find(d=>d.id===id)||{}).name||'—';
const cc=id=>(depts.find(d=>d.id===id)||{}).c||PAL[0];
const has=r=>(r.name||'').trim();
const cnt=id=>rows.filter(r=>r.dept===id&&has(r)).length;
const tot=()=>depts.reduce((a,d)=>a+cnt(d.id),0);
const fd=d=>{const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(d||'');return m?m[3]+'/'+m[2]+'/'+m[1]:''};
const safe=u=>/^https?:\/\//i.test(u||'')?u:'';
const avView=r=>r.photo?`<img class="av" src="${esc(r.photo)}" alt="">`:`<span class="av">${esc((r.name||'').trim().charAt(0))}</span>`;
const avEdit=r=>`<button class="av" data-ph="${r.id}" title="إضافة أو تغيير الصورة">${r.photo?`<img src="${esc(r.photo)}" alt="">`:'+'}</button>`;

function side(){
 const nav=(v,t,n)=>`<button class="nav ${view===v?'on':''}" data-view="${esc(v)}"><span>${esc(t)}</span><small>${n}</small></button>`;
 return `<aside class="${menuOpen?'open':''}"><img class="logo" src="logo.png" alt="المجلس الإشرافي"><span class="cur">${esc(view===ALL?'لوحة المتابعة':dn(view))}</span><button class="burger" data-menu="1" aria-label="القائمة">${menuOpen?'✕':'☰'}</button><div class="sep"></div>
 <div class="mn" style="flex:1;min-height:0;overflow-y:auto">${nav(ALL,'لوحة المتابعة',tot())}<div class="lbl">إدخال الزائرين حسب الجهة</div>${depts.map(d=>nav(d.id,d.name,cnt(d.id))).join('')}<button class="nav" data-newdept style="justify-content:center;border:1px dashed rgba(255,255,255,.35);margin-top:10px">+ إضافة قسم</button></div>
 <div class="mn" style="margin-top:14px">${canInstall()?`<button class="nav" data-install="1" style="justify-content:center;border:1px solid rgba(255,255,255,.25);margin-bottom:10px">⬇ تثبيت التطبيق</button>`:''}${GH?`<button class="nav" data-tok="1" style="justify-content:center;border:1px solid rgba(255,255,255,.25)">${TOKEN?'تسجيل الخروج':'تسجيل الدخول للتحرير'}</button>`:''}<div class="st ${off?'off':''}" style="margin-top:14px"><i></i><span id="stt">${status}</span></div></div></aside>`;
}
function rowsDash(){
 const k=q.trim();
 const l=rows.filter(r=>has(r)&&(flt===ALL||r.dept===flt)&&(!k||((r.name||'')+(r.job||'')+(r.phone||'')+(r.address||'')+(r.purpose||'')).includes(k)));
 if(!l.length)return `<tr><td colspan="11" class="empty">لا توجد أسماء بعد</td></tr>`;
 return l.map((r,i)=>`<tr><td class="n">${i+1}</td><td class="c">${avView(r)}</td><td style="font-weight:600" data-l="الاسم">${esc(r.name)}</td><td data-l="الوظيفة">${esc(r.job)}</td><td data-l="رقم الهاتف" dir="ltr" style="text-align:right">${esc(r.phone)}</td><td data-l="العنوان">${esc(r.address)}</td><td data-l="غرض الزيارة">${esc(r.purpose)}</td>
 <td class="c" data-l="تاريخ القدوم" style="white-space:nowrap">${esc(fd(r.arrive))}</td><td class="c" data-l="تاريخ العودة" style="white-space:nowrap">${esc(fd(r.back))}</td>
 <td class="c" data-l="الرابط">${safe(r.link)?`<a class="lnk" href="${esc(r.link)}" target="_blank" rel="noopener">فتح الرابط</a>`:''}</td>
 <td data-l="الجهة"><span class="badge" style="--c:${cc(r.dept)}">${esc(dn(r.dept))}</span></td></tr>`).join('');
}
function dash(){
 if(flt!==ALL&&!depts.some(d=>d.id===flt))flt=ALL;
 return `<div class="hero"><h1>أسماء الزائرين للمشاريع</h1><p>تحت المجلس الإشرافي للعام ١٤٤٨ هـ</p></div>
 <div class="stats"><button class="stat tot" data-flt="${ALL}"><b>${tot()}</b><span>إجمالي الزائرين في كل الجهات</span></button>
 ${depts.map(d=>`<button class="stat" style="--c:${d.c}" data-flt="${d.id}"><b>${cnt(d.id)}</b><span>${esc(d.name)}</span></button>`).join('')}</div>
 <div class="bar">${[{id:ALL,name:'كل الجهات'},...depts].map(d=>`<button class="pill ${flt===d.id?'on':''}" data-flt="${d.id}">${esc(d.name)}</button>`).join('')}
 <select class="fsel" id="fsel">${[{id:ALL,name:'كل الجهات'},...depts].map(d=>`<option value="${d.id}"${flt===d.id?' selected':''}>${esc(d.name)}</option>`).join('')}</select>
 <input class="search" id="q" placeholder="ابحث بالاسم أو الوظيفة أو الهاتف أو العنوان…" value="${esc(q)}"></div>
 <div class="tw"><table><thead><tr><th>م</th><th>الصورة</th><th>الاسم</th><th>الوظيفة</th><th>رقم الهاتف</th><th>العنوان</th><th>غرض الزيارة</th><th>تاريخ القدوم</th><th>تاريخ العودة</th><th>الرابط</th><th>الجهة</th></tr></thead><tbody id="tb">${rowsDash()}</tbody></table></div>`;
}
function dept(id){
 const d=depts.find(x=>x.id===id);if(!d){view=ALL;return dash()}
 const l=rows.filter(r=>r.dept===id);
 const body=l.map((r,i)=>`<tr data-id="${r.id}"><td class="n">${i+1}</td><td class="c">${avEdit(r)}</td>
 <td data-l="الاسم"><input class="cell" data-f="name" value="${esc(r.name)}" placeholder="اسم الزائر"></td>
 <td data-l="الوظيفة"><input class="cell" data-f="job" value="${esc(r.job)}" placeholder="الوظيفة"></td>
 <td data-l="رقم الهاتف"><input class="cell" data-f="phone" type="tel" inputmode="tel" dir="ltr" value="${esc(r.phone)}" placeholder="رقم الهاتف"></td>
 <td data-l="العنوان"><textarea class="cell" data-f="address" rows="1" placeholder="العنوان">${esc(r.address)}</textarea></td>
 <td data-l="غرض الزيارة"><textarea class="cell" data-f="purpose" rows="1" placeholder="غرض الزيارة">${esc(r.purpose)}</textarea></td>
 <td data-l="تاريخ القدوم"><input class="cell" data-f="arrive" type="date" value="${esc(r.arrive)}" title="اختر تاريخ القدوم"></td>
 <td data-l="تاريخ العودة"><input class="cell" data-f="back" type="date" min="${esc(r.arrive)}" value="${esc(r.back)}" title="اختر تاريخ العودة"></td>
 <td data-l="الرابط"><input class="cell" data-f="link" dir="ltr" value="${esc(r.link)}" placeholder="https://…"></td>
 <td class="act"><button class="sv${dirty.has(r.id)?' dirty':''}" data-save="${r.id}">حفظ</button><button class="x" data-del="${r.id}">حذف</button></td></tr>`).join('');
 return `<div class="dh"><input class="cell dn" data-dn="${id}" value="${esc(d.name)}" style="color:${d.c}" title="اضغط لتعديل اسم القسم"><span class="badge" style="--c:${d.c}">${cnt(id)} زائر</span>
 <button class="x" data-deld="${id}" style="margin-inline-start:auto">حذف القسم</button></div>
 <p class="hint">اضغط على الدائرة لإضافة الصورة، واضغط على اسم القسم لتعديله. بعد تعبئة بيانات الزائر اضغط زر «حفظ» ليُحفظ ويظهر في لوحة المتابعة.</p>
 <div class="tw"><table><thead><tr><th>م</th><th>الصورة</th><th style="min-width:170px">الاسم</th><th style="min-width:140px">الوظيفة</th><th style="min-width:150px">رقم الهاتف</th><th style="min-width:170px">العنوان</th><th style="min-width:180px">غرض الزيارة</th><th style="min-width:150px">تاريخ القدوم</th><th style="min-width:150px">تاريخ العودة</th><th style="min-width:130px">الرابط</th><th class="act"></th></tr></thead>
 <tbody>${body||`<tr><td colspan="11" class="empty">ابدأ بإضافة أول زائر</td></tr>`}</tbody></table></div>
 <button class="add" data-add="${id}">+ إضافة زائر جديد</button>`;
}
let lastKey='';
function render(){
 const old=$('.tw'),key=view+'|'+flt,keep=old&&key===lastKey?[old.scrollTop,old.scrollLeft]:null;
 $('#app').innerHTML=side()+`<main>${view===ALL?dash():dept(view)}</main>`;
 lastKey=key;
 if(keep){const nw=$('.tw');if(nw){nw.scrollTop=keep[0];nw.scrollLeft=keep[1]}}
 if(!canEdit()){document.querySelectorAll('[data-f],[data-dn]').forEach(e=>e.readOnly=true);document.querySelectorAll('[data-ph]').forEach(e=>e.disabled=true);document.querySelectorAll('.add,.x,.sv,[data-newdept]').forEach(e=>e.remove());const t=$('.hint');if(t)t.textContent='وضع القراءة فقط. للتعديل اضغط «تسجيل الدخول للتحرير» وأدخل رمز التحرير (PIN).'}
}
const busy=()=>document.activeElement&&document.activeElement.matches&&document.activeElement.matches('[data-f],[data-dn]');
const WHY={pin:'رمز التحرير (PIN) غير صحيح',pin_default:'لم يتم تغيير PIN في Apps Script بعد',net:'تعذّر الاتصال بالخادم',bad:'طلب غير صالح'};
function setSt(t,bad){status=t;off=!!bad;const s=$('#stt');if(s){s.textContent=t;s.parentNode.classList.toggle('off',!!bad)}}
let pend=0;
function persist(p){pend++;setSt('جارٍ الحفظ…');p.then(()=>{pend--;setSt(GH?'تم الحفظ ✓':'تم الحفظ في المتصفح')},e=>{pend--;const c=e&&e.message;setSt('تعذّر الحفظ ('+c+'): '+(WHY[c]||'خطأ غير معروف'),1);console.error(e)})}
const save=r=>{dirty.delete(r.id);persist(store.op({op:'set',row:r}))};
const T={},dirty=new Set();
window.addEventListener('beforeunload',e=>{if(dirty.size){e.preventDefault();e.returnValue=''}});
const fi=document.createElement('input');fi.type='file';fi.accept='image/*';let phId=null;
fi.onchange=()=>{
 const f=fi.files[0],id=phId;fi.value='';if(!f||!id)return;
 const im=new Image(),u=URL.createObjectURL(f);
 im.onload=()=>{
  const S=160,c=document.createElement('canvas');c.width=c.height=S;
  const m=Math.min(im.width,im.height);c.getContext('2d').drawImage(im,(im.width-m)/2,(im.height-m)/2,m,m,0,0,S,S);URL.revokeObjectURL(u);
  let k=.78,d=c.toDataURL('image/jpeg',k);while(d.length>38000&&k>.35){k-=.1;d=c.toDataURL('image/jpeg',k)}
  const r=rows.find(y=>y.id===id);if(!r)return;r.photo=d;save(r);render();
 };
 im.onerror=()=>URL.revokeObjectURL(u);im.src=u;
};
document.addEventListener('input',e=>{
 const t=e.target;
 if(t.id==='q'){q=t.value;$('#tb').innerHTML=rowsDash();return}
 if(t.dataset&&t.dataset.dn){
  const id=t.dataset.dn,d=depts.find(x=>x.id===id),v=t.value.trim();if(!d||!v)return;
  d.name=v;const s=document.querySelector('.nav[data-view="'+id+'"] span');if(s)s.textContent=v;
  clearTimeout(T['d'+id]);T['d'+id]=setTimeout(()=>persist(store.op({op:'dept_rename',id,name:v})),DEB);return;
 }
 const f=t.dataset&&t.dataset.f;if(!f)return;
 const id=t.closest('tr').dataset.id,r=rows.find(x=>x.id===id);if(!r)return;
 r[f]=t.value;
 if(f==='arrive'){const b=t.closest('tr').querySelector('[data-f=back]');if(b)b.min=t.value}
 dirty.add(id);const sb=t.closest('tr').querySelector('.sv');if(sb){sb.classList.remove('ok');sb.classList.add('dirty');sb.textContent='حفظ'}
});
document.addEventListener('change',e=>{if(e.target.id==='fsel'){flt=e.target.value;render()}});
document.addEventListener('click',e=>{
 const b=e.target.closest('button');if(!b)return;
 const d=b.dataset;
 if(d.tok!==undefined){tokenToggle();return}
 if(d.install!==undefined){installApp();return}
 if(d.menu!==undefined){menuOpen=!menuOpen;render();return}
 if(d.view!==undefined){view=d.view;menuOpen=false;if(view===ALL)flt=ALL;render();scrollTo(0,0)}
 else if(d.flt!==undefined){flt=d.flt;render()}
 else if(d.save){
  const r=rows.find(x=>x.id===d.save);if(!r)return;
  if(!(r.name||'').trim()){alert('يرجى كتابة اسم الزائر أولًا');return}
  b.disabled=true;b.textContent='جارٍ الحفظ…';
  const p=store.op({op:'set',row:r});persist(p);
  p.then(()=>{dirty.delete(r.id);render();const nb=document.querySelector('.sv[data-save="'+r.id+'"]');if(nb){nb.classList.add('ok');nb.textContent='تم الحفظ ✓';setTimeout(()=>{nb.classList.remove('ok');nb.textContent='حفظ'},2200)}},
   ()=>{b.disabled=false;b.textContent='حفظ'});
 }
 else if(d.ph){phId=d.ph;fi.click()}
 else if(d.newdept!==undefined){
  const name=(prompt('اسم القسم الجديد')||'').trim();if(!name)return;
  const n={id:'d'+Date.now().toString(36),name,c:PAL[depts.length%PAL.length]};
  depts.push(n);view=n.id;menuOpen=false;render();persist(store.op({op:'dept_add',dept:n}));scrollTo(0,0);
 }else if(d.add!==undefined){
  const r={id:'p'+Date.now().toString(36)+Math.random().toString(36).slice(2,5),dept:d.add,name:'',job:'',phone:'',address:'',purpose:'',arrive:'',back:'',link:'',photo:'',ts:Date.now()};
  rows.push(r);save(r);render();
  const a=document.querySelectorAll('input[data-f=name]');a[a.length-1]?.focus();
 }else if(d.deld){
  if(rows.some(r=>r.dept===d.deld)){alert('لا يمكن حذف قسم فيه زائرون. احذف أسماءهم أولًا.');return}
  if(!b.classList.contains('arm')){b.classList.add('arm');b.textContent='تأكيد حذف القسم';setTimeout(()=>{b.classList.remove('arm');b.textContent='حذف القسم'},3000);return}
  const id=d.deld;depts=depts.filter(x=>x.id!==id);view=ALL;flt=ALL;render();
  persist(store.op({op:'dept_del',id}));
 }else if(d.del){
  if(!b.classList.contains('arm')){b.classList.add('arm');b.textContent='تأكيد الحذف';setTimeout(()=>{b.classList.remove('arm');b.textContent='حذف'},3000);return}
  const id=d.del;rows=rows.filter(x=>x.id!==id);persist(store.op({op:'del',id}));render();
 }
});
const C=window.APP_CONFIG||{},URL_=C.SCRIPT_URL||'',GH=!!URL_;
let TOKEN=localStorage.getItem('asf-zuwar-pin')||'';
const canEdit=()=>!GH||!!TOKEN;
const DEB=GH?1200:500,LS='asf-zuwar-v1';
function norm(d){
 d=d&&!Array.isArray(d)?d:{rows:Array.isArray(d)?d:[]};
 d.rows=d.rows||[];if(!d.depts||!d.depts.length)d.depts=DEF.map(x=>({...x}));
 return d;
}
const loc=()=>{try{return norm(JSON.parse(localStorage.getItem(LS)||'null'))}catch(e){return norm(null)}};
async function call(b){
 let j;
 try{const r=await fetch(URL_,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({...b,pin:TOKEN})});j=await r.json()}
 catch(e){throw new Error('net')}
 if(!j||!j.ok)throw new Error((j&&j.error)||'net');
 return j;
}
let chain=Promise.resolve();
const queue=f=>{const run=chain.then(f);chain=run.catch(()=>{});return run};
function localOp(d,b){
 if(b.op==='set'){const i=d.rows.findIndex(x=>x.id===b.row.id);i<0?d.rows.push(b.row):d.rows[i]=b.row}
 else if(b.op==='del')d.rows=d.rows.filter(x=>x.id!==b.id);
 else if(b.op==='dept_add')d.depts.push(b.dept);
 else if(b.op==='dept_rename'){const y=d.depts.find(x=>x.id===b.id);if(y)y.name=b.name}
 else if(b.op==='dept_del')d.depts=d.depts.filter(x=>x.id!==b.id);
}
const store=GH?{
 async load(){const r=await fetch(URL_+'?action=list&t='+Date.now());return norm(await r.json())},
 op:b=>queue(()=>call(b))
}:{
 load:async()=>loc(),
 op:async b=>{const d=loc();localOp(d,b);localStorage.setItem(LS,JSON.stringify(d))}
};
async function tokenToggle(){
 if(TOKEN){TOKEN='';localStorage.removeItem('asf-zuwar-pin');render();return}
 const t=(prompt('أدخل رمز التحرير (PIN)')||'').trim();if(!t)return;
 TOKEN=t;
 try{await call({op:'check'});localStorage.setItem('asf-zuwar-pin',t)}
 catch(e){TOKEN='';alert(e.message==='pin'?'رمز التحرير (PIN) غير صحيح':'تعذّر الاتصال بالخادم ('+e.message+')')}
 render();
}
async function refresh(){
 if(pend)return;
 try{const d=await store.load();depts=d.depts;rows=d.rows.sort((a,b)=>(a.ts||0)-(b.ts||0));off=false;status=GH?'متصل بـ Google Sheet':'تخزين محلي في هذا المتصفح فقط'}
 catch(e){off=true;status='تعذّر التحميل من Google Sheet'}
 render();
}
async function init(){render();await refresh();if(GH)setInterval(()=>{if(!busy()&&!dirty.size&&!document.hidden)refresh()},30000)}
let installEv=null;
const standalone=()=>matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
const isIOS=/iphone|ipad|ipod/i.test(navigator.userAgent);
const canInstall=()=>!standalone()&&(!!installEv||isIOS);
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installEv=e;render()});
window.addEventListener('appinstalled',()=>{installEv=null;render()});
async function installApp(){
 if(installEv){installEv.prompt();try{await installEv.userChoice}catch(x){}installEv=null;render()}
 else alert('في آيفون: اضغط زر المشاركة ثم «إضافة إلى الشاشة الرئيسية».\nDi iPhone: ketuk tombol Bagikan, lalu «Tambah ke Layar Utama».');
}
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
init();
</script>
</body>
